<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 30px;
        }

        .auth-card {
            background: white;
            max-width: 450px;
            margin: 0 auto 25px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
            color: #222;
        }

        form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 10px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        .primary-btn {
            background: #2563eb;
            color: white;
            width: 100%;
        }

        .register-btn {
            background: #16a34a;
            color: white;
            width: 100%;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .update-btn {
            background: #f59e0b;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .logout-btn {
            background: #dc2626;
            color: white;
            display: block;
            margin: 0 auto 25px;
        }

        .switch-text {
            text-align: center;
            margin-top: 18px;
            color: #666;
        }

        .switch-text button {
            background: none;
            color: #2563eb;
            padding: 0;
            font-weight: bold;
        }

        .message {
            text-align: center;
            font-weight: bold;
            min-height: 20px;
        }

        #dashboard {
            display: none;
        }

        #registerCard {
            display: none;
        }

        #editCard {
            display: none;
        }

        .user-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-info strong {
            display: block;
            font-size: 17px;
            color: #222;
        }

        .user-info span {
            color: #666;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .empty-message {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>👥 User Management System</h1>


    <!-- ================= LOGIN ================= -->

    <div class="auth-card" id="loginCard">

        <h2>🔐 Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
                required
            >

            <button
                type="submit"
                class="primary-btn">
                Login
            </button>

        </form>

        <p
            id="loginMessage"
            class="message">
        </p>

        <div class="switch-text">

            Don't have an account?

            <button
                type="button"
                onclick="showRegister()">
                Register
            </button>

        </div>

    </div>


    <!-- ================= REGISTER ================= -->

    <div class="auth-card" id="registerCard">

        <h2>📝 Create Account</h2>

        <form id="registerForm">

            <input
                type="text"
                id="registerName"
                placeholder="Enter your name"
                required
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter email"
                required
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Enter password (minimum 6 characters)"
                minlength="6"
                required
            >

            <button
                type="submit"
                class="register-btn">
                Create Account
            </button>

        </form>

        <p
            id="registerMessage"
            class="message">
        </p>

        <div class="switch-text">

            Already have an account?

            <button
                type="button"
                onclick="showLogin()">
                Login
            </button>

        </div>

    </div>


    <!-- ================= DASHBOARD ================= -->

    <div id="dashboard">
    <h2 id="welcomeMessage">Dashboard</h2>
        <button
            class="logout-btn"
            onclick="logout()">
            🚪 Logout
        </button>


        <!-- ADD USER -->

        <div class="card">

            <h2>➕ Add User</h2>

            <form id="userForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Enter name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >

                <button
                    type="submit"
                    class="add-btn">
                    Add User
                </button>

            </form>

        </div>


        <!-- EDIT USER -->

        <div
            class="card"
            id="editCard">

            <h2>✏️ Edit User</h2>

            <form id="editForm">

                <input
                    type="hidden"
                    id="editId"
                >

                <input
                    type="text"
                    id="editName"
                    placeholder="Enter name"
                    required
                >

                <input
                    type="email"
                    id="editEmail"
                    placeholder="Enter email"
                    required
                >

                <button
                    type="submit"
                    class="update-btn">
                    Save Changes
                </button>

                <button
                    type="button"
                    onclick="cancelEdit()">
                    Cancel
                </button>

            </form>

        </div>


        <!-- USER LIST -->

        <div class="card">

            <h2>👥 Users</h2>

            <ul
                id="userList"
                class="user-list">
            </ul>

        </div>

    </div>

</div>


<script>
/* =========================================
   SHOW Current user
========================================= */
    async function loadCurrentUser() {
    const token = localStorage.getItem("token");

    if (!token) {
        return;
    }

    try {
        const response = await fetch("/api/auth/me", {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        const data = await response.json();

        if (handleAuthError(response)) {
         return;
        }

        if (response.ok) {
            document.getElementById("welcomeMessage").textContent =
                `Welcome, ${data.name}! 👋`;
        }

    } catch (error) {
        console.error("Failed to load current user:", error);
    }
}

/* =========================================
   SHOW LOGIN
========================================= */

function showLogin() {

    document.getElementById("loginCard").style.display = "block";

    document.getElementById("registerCard").style.display = "none";

}


/* =========================================
   SHOW REGISTER
========================================= */

function showRegister() {

    document.getElementById("loginCard").style.display = "none";

    document.getElementById("registerCard").style.display = "block";

}


/* =========================================
   REGISTER
========================================= */

document
    .getElementById("registerForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("registerName").value;

        const email =
            document.getElementById("registerEmail").value;

        const password =
            document.getElementById("registerPassword").value;


        try {

            const response = await fetch(
                "/api/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                document
                    .getElementById("registerMessage")
                    .textContent = data.message;

                return;
            }


            document
                .getElementById("registerMessage")
                .textContent =
                "Account created successfully!";


            document
                .getElementById("registerForm")
                .reset();


            setTimeout(function() {

                showLogin();

            }, 1000);

        }

        catch (error) {

            console.error(error);

            document
                .getElementById("registerMessage")
                .textContent =
                "Unable to connect to server.";

        }

    });


/* =========================================
   LOGIN
========================================= */

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("loginEmail").value;

        const password =
            document.getElementById("loginPassword").value;


        try {

            const response = await fetch(
                "/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                document
                    .getElementById("loginMessage")
                    .textContent =
                    data.message;

                return;
            }


            // Save JWT
            localStorage.setItem(
                "token",
                data.token
            );

            localStorage.setItem("refreshToken", data.refreshToken);
            document
                .getElementById("loginMessage")
                .textContent =
                "Login successful!";


            // Hide login
            document
                .getElementById("loginCard")
                .style.display = "none";


            // Show dashboard
            document
                .getElementById("dashboard")
                .style.display = "block";


            // Load users
            getUsers();

        }

        catch (error) {

            console.error(error);

            document
                .getElementById("loginMessage")
                .textContent =
                "Unable to connect to server.";

        }

    });


/* =========================================
   GET USERS
========================================= */

async function getUsers() {

    const token =
        localStorage.getItem("token");


    if (!token) {

        alert("Please login first.");

        return;
    }


    try {

        const response = await fetch(
            "/api/users",
            {
                headers: {
                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );

       await function handleAuthError(response) {
    if (response.status !== 401) {
        return false;
    }

    const refreshToken = localStorage.getItem("refreshToken");

    if (!refreshToken) {
        localStorage.removeItem("token");
        showLogin();
        return true;
    }

    try {
        const refreshResponse = await fetch("/api/auth/refresh", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                refreshToken: refreshToken
            })
        });

        const data = await refreshResponse.json();

        if (refreshResponse.ok) {
            localStorage.setItem("token", data.token);
            return false;
        }

    } catch (error) {
        console.error("Token refresh failed:", error);
    }

    localStorage.removeItem("token");
    localStorage.removeItem("refreshToken");

    alert("Your session has expired. Please login again.");

    showLogin();

    return true;
}


        const userList =
            document.getElementById("userList");


        userList.innerHTML = "";


        if (data.length === 0) {

            userList.innerHTML =
                `<li class="empty-message">
                    No users found.
                </li>`;

            return;
        }


        data.forEach(user => {

            const li =
                document.createElement("li");


            li.className =
                "user-item";


            li.innerHTML = `

                <div class="user-info">

                    <strong>
                        ${user.name}
                    </strong>

                    <span>
                        ${user.email}
                    </span>

                </div>

                <div class="actions">

                    <button
                        class="update-btn"
                        onclick="updateUser('${user._id}')">
                        Update
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteUser('${user._id}')">
                        Delete
                    </button>

                </div>
            `;


            userList.appendChild(li);

        });

    }

    catch (error) {

        console.error(error);

        alert("Unable to load users.");

    }

}


/* =========================================
   ADD USER
========================================= */

document
    .getElementById("userForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const token =
            localStorage.getItem("token");


        if (!token) {

            alert("Please login first.");

            return;
        }


        const name =
            document.getElementById("name").value;

        const email =
            document.getElementById("email").value;


        try {

            const response = await fetch(
                "/api/users",
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email
                    })
                }
            );

            if (handleAuthError(response)) {
                return;
            }
            const data =
                await response.json();


            if (!response.ok) {

                alert(data.message);

                return;
            }


            alert(
                "User added successfully!"
            );


            document
                .getElementById("userForm")
                .reset();


            getUsers();

        }

        catch (error) {

            console.error(error);

            alert("Unable to add user.");

        }

    });


/* =========================================
   GET ONE USER
========================================= */

async function updateUser(id) {

    try {

        const response = await fetch(`/api/users/${id}`, {
    headers: {
        "Authorization": `Bearer ${localStorage.getItem("token")}`
    }
});


        const user =
            await response.json();


        if (!response.ok) {

            alert(user.message);

            return;
        }


        document
            .getElementById("editId")
            .value = user._id;


        document
            .getElementById("editName")
            .value = user.name;


        document
            .getElementById("editEmail")
            .value = user.email;


        document
            .getElementById("editCard")
            .style.display = "block";

    }

    catch (error) {

        console.error(error);

        alert("Unable to get user.");

    }

}


/* =========================================
   UPDATE USER
========================================= */

document
    .getElementById("editForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const token =
            localStorage.getItem("token");
        console.log("TOKEN:", token);

        const id =
            document.getElementById("editId").value;

        const name =
            document.getElementById("editName").value;

        const email =
            document.getElementById("editEmail").value;


        try {

            const response =
                await fetch(
                    `/api/users/${id}`,
                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization": `Bearer ${localStorage.getItem("token")}`
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email
                        })
                    }
                );

                if (handleAuthError(response)) {
                    return;
                }
            const data =
                await response.json();


            if (!response.ok) {

                alert(data.message);

                return;
            }


            alert(
                "User updated successfully!"
            );


            cancelEdit();

            getUsers();

        }

        catch (error) {

            console.error(error);

            alert("Unable to update user.");

        }

    });


/* =========================================
   CANCEL EDIT
========================================= */

function cancelEdit() {

    document
        .getElementById("editCard")
        .style.display = "none";


    document
        .getElementById("editName")
        .value = "";


    document
        .getElementById("editEmail")
        .value = "";

}


/* =========================================
   DELETE USER
========================================= */

async function deleteUser(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this user?"
        );


    if (!confirmDelete) {
        return;
    }


    const token =
        localStorage.getItem("token");


    if (!token) {

        alert("Please login first.");

        return;
    }


    try {

        const response =
            await fetch(
                `/api/users/${id}`,
                {

                    method: "DELETE",

                    headers: {

                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );

            if (handleAuthError(response)) {
                return;
            }
        const data =
            await response.json();


        if (!response.ok) {

            alert(data.message);

            return;
        }


        alert(
            "User deleted successfully!"
        );


        getUsers();

    }

    catch (error) {

        console.error(error);

        alert("Unable to delete user.");

    }

}
function handleAuthError(response) {
    if (response.status === 401) {
        localStorage.removeItem("token");

        alert("Your session has expired. Please login again.");

        showLogin();

        return true;
    }

    return false;
}

/* =========================================
   LOGOUT
========================================= */

async function logout() {
    const refreshToken = localStorage.getItem("refreshToken");

    try {
        if (refreshToken) {
            await fetch("/api/auth/logout", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    refreshToken: refreshToken
                })
            });
        }
    } catch (error) {
        console.error("Logout request failed:", error);
    }

    // Clear tokens from browser
    localStorage.removeItem("token");
    localStorage.removeItem("refreshToken");

    // Clear dashboard
    const userList = document.getElementById("userList");
    if (userList) {
        userList.innerHTML = "";
    }

    // Return to login
    showLogin();

    console.log("User logged out");
}


/* =========================================
   CHECK EXISTING LOGIN
========================================= */

window.addEventListener("load", function() {

    const token =
        localStorage.getItem("token");


    if (token) {

        document
            .getElementById("loginCard")
            .style.display = "none";


        document
            .getElementById("dashboard")
            .style.display = "block";

        loadCurrentUser();
        getUsers();
}
    

});

</script>

</body>
</html>
